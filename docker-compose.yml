version: '3.8'

services:
  # ===================
  # Core Services
  # ===================

  license-server:
    build:
      context: ./packages/license-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://opendrm:opendrm@postgres:5432/opendrm
      - REDIS_URL=redis://redis:6379
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opendrm-network
    restart: unless-stopped

  packager-service:
    build:
      context: ./packages/packager-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "50052:50052"
    environment:
      - DATABASE_URL=postgresql://opendrm:opendrm@postgres:5432/opendrm
      - REDIS_URL=redis://redis:6379
      - LICENSE_SERVER_GRPC_URL=license-server:50051
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/data/content
    volumes:
      - content-data:/data/content
      - ./content:/data/input:ro
    depends_on:
      - license-server
      - redis
    networks:
      - opendrm-network
    restart: unless-stopped

  # ===================
  # Data Stores
  # ===================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opendrm
      POSTGRES_PASSWORD: opendrm
      POSTGRES_DB: opendrm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opendrm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opendrm-network
    restart: unless-stopped

  # ===================
  # CDN Stack
  # ===================

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - varnish
      - license-server
    networks:
      - opendrm-network
    restart: unless-stopped

  varnish:
    image: varnish:7-alpine
    volumes:
      - ./infrastructure/varnish/default.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      - /var/lib/varnish:exec
    environment:
      - VARNISH_SIZE=256m
    depends_on:
      - nginx-origin
    networks:
      - opendrm-network
    restart: unless-stopped

  nginx-origin:
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - content-data:/data/content:ro
    networks:
      - opendrm-network
    restart: unless-stopped

  # ===================
  # Monitoring Stack
  # ===================

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - opendrm-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - opendrm-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - opendrm-network
    restart: unless-stopped

networks:
  opendrm-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  content-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
