syntax = "proto3";

package opendrm;

// Key management service
service KeyService {
  // Get a key by ID (returns decrypted key for packaging)
  rpc GetKey(KeyRequest) returns (KeyResponse);

  // Create a new encryption key
  rpc CreateKey(CreateKeyRequest) returns (KeyResponse);

  // Revoke a key
  rpc RevokeKey(RevokeKeyRequest) returns (Empty);
}

// License service for internal use
service LicenseService {
  // Acquire a license (internal)
  rpc AcquireLicense(LicenseRequest) returns (LicenseResponse);

  // Validate a playback token
  rpc ValidateToken(TokenRequest) returns (TokenResponse);
}

message Empty {}

message KeyRequest {
  string key_id = 1;
}

message CreateKeyRequest {
  string expires_at = 1;  // ISO 8601 timestamp, optional
}

message RevokeKeyRequest {
  string key_id = 1;
}

message KeyResponse {
  string key_id = 1;
  string key_value = 2;   // Hex-encoded key
  string status = 3;
  string expires_at = 4;
}

message LicenseRequest {
  string content_id = 1;
  repeated string key_ids = 2;
  string drm_type = 3;    // clearkey, widevine, fairplay
  string client_ip = 4;
  string user_agent = 5;
  string token = 6;
}

message LicenseResponse {
  bool granted = 1;
  string error = 2;
  bytes license_data = 3;
}

message TokenRequest {
  string token = 1;
}

message TokenResponse {
  bool valid = 1;
  string subject = 2;
  string content_id = 3;
  repeated string key_ids = 4;
  int64 expires_at = 5;
}
