# OpenDRM Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opendrm'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules files
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # License Server
  - job_name: 'license-server'
    static_configs:
      - targets: ['license-server:3000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Packager Service
  - job_name: 'packager-service'
    static_configs:
      - targets: ['packager-service:3001']
    metrics_path: /metrics
    scrape_interval: 15s

  # Varnish Cache (requires varnish_exporter)
  # - job_name: 'varnish'
  #   static_configs:
  #     - targets: ['varnish-exporter:9131']

  # NGINX (requires nginx_exporter)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # PostgreSQL (requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis (requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Caddy (built-in metrics)
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
    metrics_path: /metrics
